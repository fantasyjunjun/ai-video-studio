# Alembic config.
#
# NOTE: keep this file ASCII-only. Alembic reads it with the platform locale
# encoding (GBK on some Windows setups), and any non-ASCII byte makes
# `Config()` blow up with a UnicodeDecodeError before a single migration runs.
#
# Chinese docs live in ai-video-studio-TDD.md, not here.

[alembic]
script_location = migrations
prepend_sys_path = .

# The real URL comes from app.db.session (DATABASE_URL env var).
# This default is only for the CLI. Escape % as %% (configparser interpolation).
sqlalchemy.url = sqlite:///./data/app.db

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
